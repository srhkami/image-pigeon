<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>焦點卡片 A｜Center Stage</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Arial, sans-serif;
            background: #f5f1e8;
            color: #27231d;
            height: 100vh;
            overflow: hidden
        }

        .app {
            display: grid;
            grid-template-columns:48% 52%;
            height: 100vh
        }

        .left {
            padding: 28px 24px;
            background: linear-gradient(180deg, #fbf7ed, #efe6d6);
            border-right: 1px solid #d8cdb9;
            display: flex;
            flex-direction: column;
            gap: 18px
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start
        }

        .eyebrow {
            font-size: 12px;
            letter-spacing: .18em;
            color: #9b6b35;
            font-weight: 800
        }

        .toolbar h1 {
            margin: 5px 0 4px;
            font-size: 24px
        }

        .toolbar p {
            margin: 0;
            color: #7d7468;
            font-size: 13px
        }

        .actions {
            display: flex;
            gap: 8px
        }

        .btn {
            border: 1px solid #cdbd9f;
            background: #fffaf0;
            border-radius: 999px;
            padding: 8px 13px;
            font-weight: 750;
            color: #5a4528;
            box-shadow: 0 2px 0 #dac6a1;
            cursor: pointer
        }

        .focus-list {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1100px;
            overflow: hidden
        }

        .card {
            position: absolute;
            width: min(360px, 82%);
            height: 465px;
            border-radius: 28px;
            background: #fffdf8;
            border: 1px solid rgba(93, 70, 38, .16);
            box-shadow: 0 24px 60px rgba(69, 51, 22, .18);
            padding: 14px;
            transition: .35s ease;
            cursor: pointer
        }

        .card.prev2 {
            transform: translateY(-250px) scale(.72) rotateX(-15deg);
            opacity: .18;
            filter: blur(2.4px)
        }

        .card.prev1 {
            transform: translateY(-145px) scale(.84) rotateX(-8deg);
            opacity: .45;
            filter: blur(1.1px)
        }

        .card.active {
            transform: translateY(0) scale(1);
            opacity: 1;
            filter: none;
            z-index: 5
        }

        .card.next1 {
            transform: translateY(145px) scale(.84) rotateX(8deg);
            opacity: .45;
            filter: blur(1.1px)
        }

        .card.next2 {
            transform: translateY(250px) scale(.72) rotateX(15deg);
            opacity: .18;
            filter: blur(2.4px)
        }

        .photo {
            height: 305px;
            border-radius: 21px;
            background: var(--bg);
            position: relative;
            overflow: hidden
        }

        .photo:after {
            content: "";
            position: absolute;
            inset: 18px;
            border: 2px solid rgba(255, 255, 255, .45);
            border-radius: 18px
        }

        .landscape .photo {
            height: 225px;
            margin-top: 38px
        }

        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 13px 4px 8px
        }

        .tag {
            font-size: 12px;
            padding: 5px 9px;
            border-radius: 999px;
            background: #efe1c9;
            color: #75522b;
            font-weight: 800
        }

        .note {
            font-size: 14px;
            color: #50483e;
            border-top: 1px dashed #dbcab1;
            padding: 12px 4px 0;
            line-height: 1.5
        }

        .toggle {
            margin-top: 10px;
            width: 100%;
            border: 0;
            border-radius: 16px;
            padding: 10px;
            background: #2f6b55;
            color: #fff;
            font-weight: 850
        }

        .hint {
            text-align: center;
            color: #897d6f;
            font-size: 13px
        }

        .right {
            padding: 26px;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 14px
        }

        .preview-head {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .preview-head h2 {
            margin: 0;
            font-size: 20px
        }

        .page-chip {
            padding: 8px 12px;
            border-radius: 999px;
            background: #e6f0ff;
            color: #28528f;
            font-weight: 800;
            font-size: 13px
        }

        .paper {
            margin: auto;
            width: 430px;
            height: 608px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 22px 55px rgba(15, 23, 42, .16);
            padding: 26px;
            display: grid;
            gap: 14px
        }

        .slot {
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            padding: 9px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #fff
        }

        .slot.active {
            outline: 4px solid rgba(47, 107, 85, .22);
            border-color: #2f6b55
        }

        .slot-photo {
            flex: 1;
            border-radius: 9px;
            background: var(--bg);
            min-height: 110px
        }

        .slot-note {
            height: 30px;
            border-radius: 7px;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            font-size: 12px;
            color: #64748b;
            display: flex;
            align-items: center;
            padding: 0 8px
        }

        .page.landscape2 {
            grid-template-rows:1fr 1fr
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #7d8794
        }

        .nav {
            display: flex;
            gap: 8px;
            justify-content: center
        }

        .nav button {
            border: 0;
            background: #111827;
            color: white;
            border-radius: 10px;
            padding: 8px 11px;
            cursor: pointer
        }

        .ghost {
            opacity: .35
        }

        .page {
            display: grid;
            gap: 14px;
            height: 100%
        }

        @media (max-width: 900px) {
            .app {
                grid-template-columns:1fr
            }

            .right {
                display: none
            }
        }</style>
</head>
<body>
<main class="app" data-layout="center-stage-focus">
    <section class="left">
        <div class="toolbar">
            <div>
                <div class="eyebrow">FOCUS CARD</div>
                <h1>左側焦點卡片</h1>
                <p>目前圖片最大，相鄰圖片縮小、虛化；右側自動切到所在頁。</p></div>
            <div class="actions">
                <button class="btn">匯入</button>
                <button class="btn">重新排序</button>
            </div>
        </div>
        <div class="focus-list" id="list"></div>
        <div class="hint">點上/下方卡片切換焦點，或用方向鍵模擬捲動</div>
    </section>
    <section class="right">
        <div class="preview-head">
            <div><h2 id="pageTitle">第 1 頁預覽</h2>
                <div class="footer">自動版型：橫圖 2 張</div>
            </div>
            <div class="page-chip" id="chip">焦點：IMG-02</div>
        </div>
        <div class="paper">
            <div class="page landscape2" id="paper"></div>
        </div>
        <div class="nav">
            <button onclick="move(-1)">上一張</button>
            <button onclick="move(1)">下一張</button>
        </div>
    </section>
</main>
<script>
    const items = [['IMG-01', 'landscape', '現場遠景', 'linear-gradient(135deg,#95c2ff,#f8c8dc)'], ['IMG-02', 'landscape', '門口招牌', 'linear-gradient(135deg,#f8bf7b,#d94f45)'], ['IMG-03', 'landscape', '施工區域', 'linear-gradient(135deg,#8ac6d1,#28527a)'], ['IMG-04', 'large', '直式文件', 'linear-gradient(160deg,#bdd7b4,#3b7a57)'], ['IMG-05', 'landscape', '補充照片', 'linear-gradient(135deg,#d8b4fe,#60a5fa)'], ['IMG-06', 'large', '人員簽核', 'linear-gradient(160deg,#fef08a,#fb923c)'], ['IMG-07', 'large', '設備照片', 'linear-gradient(160deg,#c4b5fd,#6366f1)']];
    let active = 1;

    function pages() {
        return [[[0, 1], '橫圖 2 張'], [[2, null], '橫圖 2 張'], [[3, null], '大直圖 2 張'], [[4, null], '橫圖 2 張'], [[5, 6], '大直圖 2 張']]
    }

    function findPage(i) {
        return pages().findIndex(p => p[0].includes(i))
    }

    function render() {
        const list = document.getElementById('list');
        list.innerHTML = '';
        items.forEach((it, i) => {
            const d = i - active;
            if (Math.abs(d) > 2) return;
            const c = document.createElement('article');
            c.className = 'card ' + (d === 0 ? 'active' : d < 0 ? 'prev' + Math.abs(d) : 'next' + d) + ' ' + (it[1] === 'landscape' ? 'landscape' : '');
            c.style.setProperty('--bg', it[3]);
            c.onclick = () => {
                active = i;
                render()
            };
            c.innerHTML = `<div class="photo"></div><div class="meta"><strong>${it[0]}</strong><span class="tag">${it[1] === 'landscape' ? '橫圖' : it[1] === 'large' ? '大直圖' : '小直圖'}</span></div><div class="note">${it[2]}：這裡是圖片備註欄，可輸出到 Word。</div>${it[1] !== 'landscape' ? '<button class="toggle">切換大 / 小直圖</button>' : ''}`;
            list.appendChild(c)
        });
        const pi = findPage(active);
        const p = pages()[pi];
        document.getElementById('pageTitle').textContent = `第 ${pi + 1} 頁預覽`;
        document.getElementById('chip').textContent = `焦點：${items[active][0]}`;
        const paper = document.getElementById('paper');
        paper.innerHTML = '';
        p[0].forEach(idx => {
            const s = document.createElement('div');
            s.className = 'slot ' + (idx === active ? 'active' : '') + (idx == null ? ' ghost' : '');
            if (idx == null) {
                s.innerHTML = '<div class="slot-photo"></div><div class="slot-note">空白備註欄</div>'
            } else {
                s.style.setProperty('--bg', items[idx][3]);
                s.innerHTML = `<div class="slot-photo"></div><div class="slot-note">${items[idx][2]}</div>`
            }
            paper.appendChild(s)
        });
    }

    function move(n) {
        active = Math.max(0, Math.min(items.length - 1, active + n));
        render()
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown') move(1);
        if (e.key === 'ArrowUp') move(-1)
    });
    render();
</script>
</body>
</html>
