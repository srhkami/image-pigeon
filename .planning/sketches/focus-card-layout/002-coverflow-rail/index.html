<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>焦點卡片 B｜Coverflow Rail</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:#101820;color:#eef2f7}.app{display:grid;grid-template-columns:50% 50%;height:100vh}.left{padding:24px;background:radial-gradient(circle at 20% 10%,#26394a,#101820 50%);display:grid;grid-template-rows:auto 1fr auto;gap:16px;border-right:1px solid rgba(255,255,255,.08)}h1{margin:0;font-size:25px}.sub{color:#9fb0c1;font-size:13px;margin-top:4px}.rail{position:relative;overflow:hidden}.track{position:relative;height:100%;min-height:560px}.card{position:absolute;top:50%;left:50%;width:198px;height:390px;border-radius:24px;background:#172331;border:1px solid rgba(255,255,255,.1);padding:12px;opacity:.35;filter:blur(1.8px) saturate(.7);transform:translate(-50%,-50%) translateX(var(--x)) scale(.74);transition:.38s ease;cursor:pointer}.card.active{width:304px;height:520px;opacity:1;filter:none;transform:translate(-50%,-50%) translateX(var(--x)) scale(1);box-shadow:0 34px 80px rgba(0,0,0,.45);background:#f9fbff;color:#111827;z-index:5}.photo{height:260px;border-radius:18px;background:var(--bg);position:relative;overflow:hidden}.active .photo{height:350px}.photo:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.45),transparent 42%,rgba(0,0,0,.12))}.name{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 6px}.pill{font-size:11px;border-radius:999px;padding:5px 8px;background:#1d4ed8;color:white;font-weight:800}.active .pill{background:#111827}.note{font-size:13px;color:#93a4b5}.active .note{color:#4b5563;font-size:14px}.editbar{display:flex;gap:8px;flex-wrap:wrap}.editbar button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#e2e8f0;border-radius:12px;padding:9px 12px;font-weight:750}.right{background:#e8edf3;color:#111827;padding:22px;display:grid;grid-template-rows:auto 1fr}.top{display:flex;justify-content:space-between;align-items:end}.top h2{margin:0}.mini{color:#64748b;font-size:13px}.paper{align-self:center;justify-self:center;width:420px;height:594px;background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(15,23,42,.22);padding:24px;display:grid;gap:13px}.layout{height:100%;display:grid;gap:13px}.slot{display:flex;flex-direction:column;border-radius:14px;border:1px solid #cbd5e1;overflow:hidden;background:#f8fafc}.slot.active{outline:5px solid rgba(29,78,216,.18);border-color:#2563eb}.slot .img{flex:1;background:var(--bg)}.slot .cap{height:34px;padding:8px 10px;border-top:1px dashed #cbd5e1;color:#475569;font-size:12px;background:white}.large2{grid-template-columns:1fr 1fr}.large2 .slot .img{min-height:430px}.land2{grid-template-rows:1fr 1fr}.empty{opacity:.28}.counter{border-radius:999px;background:#111827;color:white;padding:8px 12px;font-size:13px;font-weight:800}@media(max-width:900px){.app{grid-template-columns:1fr}.right{display:none}}</style></head><body><main class="app" data-layout="coverflow-rail"><section class="left"><header><h1>Coverflow 橫向焦點列</h1><div class="sub">像相簿挑片：中心卡片最大，左右卡片退後、模糊。適合快速左右切換。</div></header><div class="rail"><div class="track" id="track"></div></div><div class="editbar"><button onclick="move(-1)">← 前一張</button><button onclick="move(1)">下一張 →</button><button>備註</button><button>旋轉</button><button>直圖：大 / 小</button></div></section><section class="right"><div class="top"><div><h2 id="title">第 1 頁</h2><div class="mini" id="desc">Word 預覽同步焦點圖片所在頁</div></div><div class="counter" id="counter"></div></div><div class="paper"><div class="layout" id="paper"></div></div></section></main><script>
const items=[['IMG-01','land','施工前全景','linear-gradient(135deg,#38bdf8,#0f172a)'],['IMG-02','land','施工後全景','linear-gradient(135deg,#fb7185,#facc15)'],['IMG-03','large','文件正面','linear-gradient(160deg,#4ade80,#14532d)'],['IMG-04','large','文件背面','linear-gradient(160deg,#fde68a,#b45309)'],['IMG-05','land','補充現場','linear-gradient(135deg,#a78bfa,#312e81)'],['IMG-06','large','設備近照','linear-gradient(160deg,#67e8f9,#0891b2)']];let active=2;function pages(){return [[[0,1],'land2','橫圖 2 張'],[[2,3],'large2','大直圖 2 張'],[[4,null],'land2','橫圖 2 張'],[[5,null],'large2','大直圖 2 張']]}function pageOf(i){return pages().findIndex(p=>p[0].includes(i))}function render(){const t=document.getElementById('track');t.innerHTML='';items.forEach((it,i)=>{const offset=i-active; if(Math.abs(offset)>2)return; const c=document.createElement('article');c.className='card '+(i===active?'active':'');c.style.setProperty('--bg',it[3]);c.style.setProperty('--x',`${offset*205}px`);c.onclick=()=>{active=i;render()};c.innerHTML=`<div class="photo"></div><div class="name"><strong>${it[0]}</strong><span class="pill">${it[1]==='land'?'橫圖':'大直圖'}</span></div><div class="note">${it[2]}，目前左側排序不跳號，右側依序自動分頁。</div>`;t.appendChild(c)});const pi=pageOf(active),p=pages()[pi];document.getElementById('title').textContent=`第 ${pi+1} 頁`;document.getElementById('desc').textContent=p[2];document.getElementById('counter').textContent=`焦點 ${active+1}/${items.length}`;const paper=document.getElementById('paper');paper.className='layout '+p[1];paper.innerHTML='';p[0].forEach(idx=>{const s=document.createElement('div');s.className='slot '+(idx===active?'active':'')+(idx==null?' empty':'');if(idx!=null)s.style.setProperty('--bg',items[idx][3]);s.innerHTML=`<div class="img"></div><div class="cap">${idx==null?'空白備註欄':items[idx][2]}</div>`;paper.appendChild(s)})}function move(n){active=Math.max(0,Math.min(items.length-1,active+n));render()}render();</script></body></html>
