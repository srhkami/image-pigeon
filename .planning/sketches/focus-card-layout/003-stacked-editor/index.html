<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>焦點卡片 C｜Stacked Editor</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:#f7f8fb;color:#1f2937}.app{display:grid;grid-template-columns:46% 54%;height:100vh}.left{padding:22px;background:#ffffff;border-right:1px solid #e5e7eb;display:grid;grid-template-rows:auto 1fr}.head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:12px}.head h1{margin:0;font-size:24px}.head p{margin:4px 0 0;color:#6b7280;font-size:13px}.seg{display:flex;background:#f3f4f6;border-radius:14px;padding:4px}.seg button{border:0;border-radius:10px;background:transparent;padding:8px 10px;font-weight:800;color:#6b7280}.seg button.active{background:white;box-shadow:0 2px 8px rgba(0,0,0,.08);color:#111827}.editor{position:relative;overflow:hidden;padding:14px 8px}.stack{height:100%;position:relative}.row{position:absolute;left:18px;right:18px;height:112px;border:1px solid #e5e7eb;border-radius:20px;background:white;box-shadow:0 10px 28px rgba(31,41,55,.06);display:grid;grid-template-columns:118px 1fr auto;gap:14px;padding:10px;align-items:center;transition:.32s ease;cursor:pointer}.row.focus{height:244px;grid-template-columns:210px 1fr;align-items:start;border-color:#f59e0b;box-shadow:0 22px 55px rgba(245,158,11,.22);z-index:4}.row.before2{transform:translateY(0) scale(.9);opacity:.18;filter:blur(2px)}.row.before1{transform:translateY(86px) scale(.94);opacity:.45;filter:blur(.9px)}.row.focus{transform:translateY(188px) scale(1);opacity:1;filter:none}.row.after1{transform:translateY(456px) scale(.94);opacity:.45;filter:blur(.9px)}.row.after2{transform:translateY(542px) scale(.9);opacity:.18;filter:blur(2px)}.thumb{height:92px;border-radius:14px;background:var(--bg)}.focus .thumb{height:222px}.info strong{font-size:15px}.focus .info strong{font-size:22px}.type{display:inline-flex;margin-top:8px;border-radius:999px;background:#fef3c7;color:#92400e;padding:5px 9px;font-size:12px;font-weight:900}.note{margin-top:10px;color:#6b7280;font-size:13px;line-height:1.45}.focus .note{font-size:15px;color:#374151}.tools{display:none;margin-top:18px;gap:8px;flex-wrap:wrap}.focus .tools{display:flex}.tools button{border:1px solid #d1d5db;background:#f9fafb;border-radius:12px;padding:9px 11px;font-weight:800}.handle{color:#9ca3af;font-size:24px}.focus .handle{display:none}.right{padding:24px;background:linear-gradient(180deg,#eef2ff,#f8fafc);display:grid;grid-template-rows:auto 1fr}.pagebar{display:flex;align-items:center;justify-content:space-between}.pagebar h2{margin:0}.status{background:#4338ca;color:white;border-radius:999px;padding:8px 12px;font-weight:850;font-size:13px}.paper{place-self:center;width:450px;height:636px;background:white;border-radius:10px;box-shadow:0 24px 70px rgba(67,56,202,.18);padding:26px}.mixed{height:100%;display:grid;grid-template-rows:1fr 1.28fr;gap:14px}.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.slot{border:1px solid #cbd5e1;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;background:#fff}.slot.active{outline:5px solid rgba(245,158,11,.25);border-color:#f59e0b}.img{flex:1;background:var(--bg);min-height:80px}.caption{height:32px;border-top:1px dashed #cbd5e1;background:#f9fafb;color:#64748b;font-size:12px;display:flex;align-items:center;padding:0 8px}.big .img{min-height:220px}.legend{margin-top:10px;color:#64748b;font-size:13px;text-align:center}.empty{opacity:.3}@media(max-width:900px){.app{grid-template-columns:1fr}.right{display:none}}</style></head><body><main class="app" data-layout="stacked-editor-focus"><section class="left"><div class="head"><div><h1>編輯器式焦點卡片</h1><p>保留列表感與拖曳把手；焦點列展開成可編輯卡片，相鄰列退後。</p></div><div class="seg"><button>清單</button><button class="active">焦點</button></div></div><div class="editor"><div class="stack" id="stack"></div></div></section><section class="right"><div class="pagebar"><div><h2>右側 Word 頁面預覽</h2><div class="legend" id="legend">上 3 小直，下 1 橫</div></div><div class="status" id="status">焦點圖片</div></div><div class="paper"><div class="mixed"><div class="top3" id="top3"></div><div class="slot big" id="bottom"></div></div></div></section></main><script>
const items=[['IMG-01','small','窗邊細節','linear-gradient(160deg,#bae6fd,#0284c7)'],['IMG-02','small','門框近照','linear-gradient(160deg,#fecaca,#dc2626)'],['IMG-03','small','管線位置','linear-gradient(160deg,#bbf7d0,#16a34a)'],['IMG-04','land','完整橫圖','linear-gradient(135deg,#fde68a,#f97316)'],['IMG-05','large','直式文件','linear-gradient(160deg,#ddd6fe,#7c3aed)'],['IMG-06','large','簽名頁','linear-gradient(160deg,#fbcfe8,#db2777)']];let active=1;function render(){const stack=document.getElementById('stack');stack.innerHTML='';items.forEach((it,i)=>{const d=i-active;if(Math.abs(d)>2)return;const cls=d===0?'focus':d<0?'before'+Math.abs(d):'after'+d;const row=document.createElement('article');row.className='row '+cls;row.style.setProperty('--bg',it[3]);row.onclick=()=>{active=i;render()};row.innerHTML=`<div class="thumb"></div><div class="info"><strong>${it[0]} ${it[2]}</strong><br><span class="type">${it[1]==='land'?'橫圖':it[1]==='small'?'小直圖':'大直圖'}</span><div class="note">備註欄可直接在焦點卡片中編輯；切換大/小直圖後右側立即重新排版。</div><div class="tools"><button>編輯備註</button><button>旋轉</button><button>大 / 小直圖</button><button>刪除</button></div></div><div class="handle">⋮⋮</div>`;stack.appendChild(row)});document.getElementById('status').textContent=`焦點：${items[active][0]}`;const top=document.getElementById('top3');top.innerHTML='';[0,1,2].forEach(idx=>{const s=document.createElement('div');s.className='slot '+(idx===active?'active':'');s.style.setProperty('--bg',items[idx][3]);s.innerHTML=`<div class="img"></div><div class="caption">${items[idx][2]}</div>`;top.appendChild(s)});const b=document.getElementById('bottom');b.className='slot big '+(active===3?'active':'');b.style.setProperty('--bg',items[3][3]);b.innerHTML=`<div class="img"></div><div class="caption">${items[3][2]}</div>`}render();</script></body></html>
