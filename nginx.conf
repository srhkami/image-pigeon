    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # 1. 第一優先級：精確匹配 Service Worker 檔案，絕對不快取
        location = /sw.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            expires off;

            # 找不到 sw.js 時回傳空白內容，避免 SPA fallback 回傳 index.html
            try_files $uri =200 "";
        }

        # 2. PDF.js 模組 Worker
        #
        # Vite 產物名稱會包含 hash，例如：
        # /assets/pdf.worker.min-qwK7q_zL.mjs
        #
        # 使用比 /assets/ 更長的前綴，避免受到 ^~ /assets/ 阻擋。
        location ^~ /assets/pdf.worker {
            default_type application/javascript;
            try_files $uri =404;

            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 3. Vite 帶 hash 的一般靜態資產
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 4. 其他根目錄圖片或舊有靜態檔案
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # 5. 根目錄與 SPA 路由
        location / {
            try_files $uri $uri/ /index.html;

            add_header Cache-Control "no-store, no-cache, must-revalidate" always;

            add_header Clear-Site-Data '"cache", "executionContexts"' always;
        }
    }